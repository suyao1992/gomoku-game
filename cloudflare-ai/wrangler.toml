name = "gomoku-ai-matcher"
main = "matchmaking-worker.js"
compatibility_date = "2024-01-01"

# KV命名空间绑定
[[kv_namespaces]]
binding = "AI_STATUS"
id = "70c2ab0a568347e8af4837f1c03b209c"

# Cron定时器 - 每30分钟触发AI自动对局
[triggers]
crons = ["*/30 * * * *"]

# 环境变量
[vars]
ENABLE_AI_BOTS = "true"
MAX_AI_MATCHES_PER_HOUR = "10"

# 开发环境配置
[env.dev]
name = "gomoku-ai-matcher-dev"
vars = { ENABLE_AI_BOTS = "true" }
